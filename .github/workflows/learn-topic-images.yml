name: Localize Learn Trading images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/learn-topic-images.yml"

permissions:
  contents: write

jobs:
  download-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and convert mapped topic images
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          import re, urllib.request, pathlib, time
          from PIL import Image
          from io import BytesIO

          source = pathlib.Path("index.html").read_text(encoding="utf-8")
          block = source.split("const topicImageSources={", 1)[1].split("\n  };", 1)[0]
          out = pathlib.Path("assets/learn-trading")
          out.mkdir(parents=True, exist_ok=True)
          entries = []
          for line in block.splitlines():
              m = re.match(r"\s*'([^']+)':\s*(.*)", line)
              if not m:
                  continue
              topic_id, rhs = m.groups()
              urls = re.findall(r"'(https?://[^']+)'", rhs)
              for index, url in enumerate(urls):
                  entries.append((topic_id, index, url))
          success, failed = [], []
          for topic_id, index, url in entries:
              target = out / f"{topic_id}-{index}.webp"
              if target.exists() and target.stat().st_size > 1000:
                  success.append(str(target))
                  continue
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 (compatible; NabilFxImageArchiver/1.0)"})
                  with urllib.request.urlopen(req, timeout=25) as response:
                      raw = response.read(15 * 1024 * 1024 + 1)
                  if len(raw) > 15 * 1024 * 1024:
                      raise ValueError("image exceeds 15 MB")
                  im = Image.open(BytesIO(raw))
                  im.seek(0)
                  if im.width < 80 or im.height < 60:
                      raise ValueError("image dimensions too small")
                  if im.mode not in ("RGB", "RGBA"):
                      im = im.convert("RGBA" if "transparency" in im.info else "RGB")
                  im.save(target, "WEBP", quality=88, method=5)
                  success.append(str(target))
              except Exception as exc:
                  failed.append((topic_id, index, str(exc)[:160]))
              time.sleep(0.15)
          print(f"Mapped source images: {len(entries)}; archived: {len(success)}; failed: {len(failed)}")
          pathlib.Path("assets/learn-trading/archive-report.txt").write_text(
              "\n".join([f"SUCCESS {p}" for p in success] + [f"FAILED {a}/{b}: {c}" for a,b,c in failed]),
              encoding="utf-8")
          PY
      - name: Commit archived image assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/learn-trading
          if ! git diff --cached --quiet; then
            git commit -m "Archive Learn Trading topic images locally"
            git push origin main
          fi
