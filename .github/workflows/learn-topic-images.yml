name: Localize Learn Trading images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/learn-topic-images.yml"
      - "index.html"

permissions:
  contents: write

jobs:
  download-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and convert mapped topic images
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          import re, urllib.request, pathlib, time
          from PIL import Image
          from io import BytesIO

          source = pathlib.Path("index.html").read_text(encoding="utf-8")
          block = source.split("const topicImageSources={", 1)[1].split("\n  };", 1)[0]
          out = pathlib.Path("assets/learn-trading")
          out.mkdir(parents=True, exist_ok=True)
          # Backup real-image sources for the URLs that failed on the first archive pass.
          alternatives = {
              "liquidity-sweep": ["https://static.wixstatic.com/media/318d72_eaa80ca81d464251b9e63532153647d9~mv2.png/v1/fill/w_1000%2Ch_667%2Cal_c%2Cq_90%2Cusm_0.66_1.00_0.01/318d72_eaa80ca81d464251b9e63532153647d9~mv2.png"],
              "fvg": ["https://cdnimg.co/371b002f-238c-447e-ab32-376ec63929d2/59a2223a-fa46-493a-a548-0596f158df95/fvg-trading-strategy-fair-value-gap.jpg"],
              "r-multiples": ["https://forexmechanics.com/risk-management/risk-reward-ratio/1200/rr-obliczanie-przyklad-eurusd.jpg"],
              "order-types": ["https://a.storyblok.com/f/179899/1680x986/6f848e2521/the-most-common-order-types-for-stocks.png"],
              "portfolio-diversification": ["https://miro.medium.com/v2/resize%3Afit%3A1400/1%2A0_ThvKc62srgMqPfqouLbg.png"],
              "short-selling-stocks": ["https://img.capital.com/articles/articleimg_0f97fd85c4d171dd1c30a232e7fb5b3d911d6424.png"],
              "credit-ratings-spreads": ["https://static.capitalgroup.com/content/dam/cgc/shared-content/images/institutional/media/2024/december/chart-article_GK_US-IG_HY-916xVH_1_.png"],
              "investment-scam-due-diligence": ["https://static.wixstatic.com/media/318d72_eaa80ca81d464251b9e63532153647d9~mv2.png/v1/fill/w_1000%2Ch_667%2Cal_c%2Cq_90%2Cusm_0.66_1.00_0.01/318d72_eaa80ca81d464251b9e63532153647d9~mv2.png"],
              "risk-management": ["https://forexmechanics.com/risk-management/risk-reward-ratio/1200/rr-obliczanie-przyklad-eurusd.jpg"],
              "correlation": ["https://miro.medium.com/v2/resize%3Afit%3A1400/1%2A0_ThvKc62srgMqPfqouLbg.png"],
              "trend-vs-mean-reversion": ["https://fxnx.com/_next/image?q=75&url=https%3A%2F%2Fcdn.sanity.io%2Fimages%2F1tyytg47%2Fproduction%2F8346d4163765ccba8e0cf9ea574cd90aaf886672-2400x1792.png%3Fw%3D800%26fm%3Dwebp%26q%3D80&w=3840"]
          }
          entries = []
          for line in block.splitlines():
              m = re.match(r"\s*'([^']+)':\s*(.*)", line)
              if not m:
                  continue
              topic_id, rhs = m.groups()
              urls = re.findall(r"'(https?://[^']+)'", rhs)
              for index, url in enumerate(urls):
                  entries.append((topic_id, index, url))
          success, failed = [], []
          for topic_id, index, url in entries:
              target = out / f"{topic_id}-{index}.webp"
              if target.exists() and target.stat().st_size > 1000:
                  success.append(str(target))
                  continue
              candidates = [url]
              if index == 0:
                  candidates += alternatives.get(topic_id, [])
              saved = False
              errors = []
              for candidate in candidates:
                  attempts = [candidate,
                      "https://images.weserv.nl/?url=" + candidate,
                      "https://wsrv.nl/?url=" + candidate]
                  for attempt in attempts:
                      try:
                          req = urllib.request.Request(attempt, headers={"User-Agent":"Mozilla/5.0 (compatible; NabilFxImageArchiver/1.0)", "Accept":"image/avif,image/webp,image/png,image/*,*/*;q=0.8"})
                          with urllib.request.urlopen(req, timeout=30) as response:
                              raw = response.read(15 * 1024 * 1024 + 1)
                          if len(raw) > 15 * 1024 * 1024:
                              raise ValueError("image exceeds 15 MB")
                          im = Image.open(BytesIO(raw))
                          im.seek(0)
                          if im.width < 80 or im.height < 60:
                              raise ValueError("image dimensions too small")
                          if im.mode not in ("RGB", "RGBA"):
                              im = im.convert("RGBA" if "transparency" in im.info else "RGB")
                          im.save(target, "WEBP", quality=88, method=5)
                          success.append(str(target))
                          saved = True
                          break
                      except Exception as exc:
                          errors.append(str(exc)[:90])
                  if saved:
                      break
              if not saved:
                  failed.append((topic_id, index, " | ".join(errors[-3:])))
              time.sleep(0.12)
          print(f"Mapped source images: {len(entries)}; archived: {len(success)}; failed: {len(failed)}")
          pathlib.Path("assets/learn-trading/archive-report.txt").write_text(
              "\n".join([f"SUCCESS {p}" for p in success] + [f"FAILED {a}/{b}: {c}" for a,b,c in failed]),
              encoding="utf-8")
          PY
      - name: Commit archived image assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/learn-trading
          if ! git diff --cached --quiet; then
            git commit -m "Archive remaining Learn Trading images locally"
            git push origin main
          fi
