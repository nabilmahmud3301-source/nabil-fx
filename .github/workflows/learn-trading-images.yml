name: Build Learn Trading image library
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/learn-trading-images.yml'
      - 'scripts/fetch_learn_images.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: learn-trading-image-library
  cancel-in-progress: false
jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install downloader
        run: python -m pip install requests pillow
      - name: Download topic-specific licensed images
        run: python scripts/fetch_learn_images.py
      - name: Commit local images and attribution manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/learn-trading assets/learn-trading-manifest.json
          if git diff --cached --quiet; then echo "No verified images to commit."; else git commit -m "Add licensed Learn Trading topic images"; git push; fi
