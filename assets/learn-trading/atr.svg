<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650"><rect width="1200" height="650" rx="18" fill="#080d13"/><text x="48" y="62" fill="#f1f5f9" font-size="30" font-family="Arial" font-weight="800">AVERAGE TRUE RANGE (ATR)</text><g font-family="Arial" font-weight="700"><rect x="36" y="92" width="548" height="510" rx="14" fill="#101a25" stroke="#2b4558"/><rect x="616" y="92" width="548" height="510" rx="14" fill="#101a25" stroke="#2b4558"/><text x="64" y="135" fill="#48c7a0" font-size="21">LOW ATR · QUIET MARKET</text><text x="644" y="135" fill="#e07884" font-size="21">HIGH ATR · EXPANDING RANGE</text><path d='M80 290 L140 310 L200 280 L260 320 L320 290 L380 315 L440 285 L520 300' stroke='#73a9e8' stroke-width='5' fill='none'/><path d='M100 440 V410 M170 440 V400 M240 440 V415 M310 440 V405 M380 440 V410 M450 440 V400' stroke='#73a9e8' stroke-width='14'/><path d='M660 390 L730 300 L800 420 L870 220 L940 390 L1010 160 L1100 440' stroke='#e07884' stroke-width='5' fill='none'/><path d='M680 440 V370 M750 440 V330 M820 440 V280 M890 440 V250 M960 440 V190 M1030 440 V150' stroke='#e07884' stroke-width='14'/><text x="84" y="550" fill="#9aabba" font-size="17">Smaller true ranges indicate lower realized volatility</text><text x="664" y="550" fill="#9aabba" font-size="17">Larger true ranges indicate expanding volatility</text></g></svg>