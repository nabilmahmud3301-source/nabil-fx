<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-label="Premium discount equilibrium trading chart"><rect width="1100" height="520" rx="18" fill="#080d13" stroke="#34465b"/><text x="42" y="48" fill="#f4f7fb" font-family="Arial" font-size="25" font-weight="700">PREMIUM &amp; DISCOUNT — 50% EQUILIBRIUM</text><text x="1055" y="47" text-anchor="end" fill="#93a4b8" font-family="Arial" font-size="12">DEALING RANGE EXAMPLE</text><rect x="115" y="95" width="870" height="320" rx="10" fill="#101a25" stroke="#34465b"/><rect x="130" y="110" width="840" height="145" fill="#e87986" fill-opacity=".13"/><rect x="130" y="255" width="840" height="145" fill="#42c99a" fill-opacity=".13"/><path d="M130 255H970" stroke="#d7b66e" stroke-width="3" stroke-dasharray="9 7"/><text x="155" y="145" fill="#e87986" font-family="Arial" font-size="22" font-weight="700">PREMIUM</text><text x="155" y="178" fill="#cbd5e1" font-family="Arial" font-size="15">Above 50% equilibrium</text><text x="155" y="300" fill="#42c99a" font-family="Arial" font-size="22" font-weight="700">DISCOUNT</text><text x="155" y="333" fill="#cbd5e1" font-family="Arial" font-size="15">Below 50% equilibrium</text><text x="985" y="250" text-anchor="end" fill="#d7b66e" font-family="Arial" font-size="15" font-weight="700">50% EQ</text><path d="M270 360 L365 315 L450 345 L540 220 L625 250 L710 160 L805 205 L900 125" fill="none" stroke="#e6edf5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M710 160 L805 205 L900 125" fill="none" stroke="#e87986" stroke-width="5"/><path d="M270 360 L365 315 L450 345 L540 220" fill="none" stroke="#42c99a" stroke-width="5"/><text x="115" y="452" fill="#cbd5e1" font-family="Arial" font-size="14">Define the dealing-range high and low first. Premium/discount is location context, not an entry trigger.</text></svg>