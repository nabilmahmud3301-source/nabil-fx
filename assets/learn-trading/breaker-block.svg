<g transform="translate(565 78)"><rect width="500" height="350" rx="12" fill="#0a111b" stroke="#6b3b45"/><text x="22" y="34" fill="#e87986" font-family="Arial,sans-serif" font-size="18" font-weight="700">BEARISH BREAKER</text>
<path d="M25 90H475 M25 160H475 M25 230H475 M25 300H475" stroke="#263443" stroke-dasharray="3 7"/>
<rect x="155" y="135" width="175" height="48" rx="4" fill="#e87986" fill-opacity=".20" stroke="#e87986" stroke-width="2"/>
<text x="168" y="128" fill="#e87986" font-family="Arial,sans-serif" font-size="13" font-weight="700">FAILED SUPPORT → RESISTANCE</text>
<path d="M35 72 L75 95 L115 70 L150 130 L190 110 L230 185 L270 150 L305 245 L345 210 L385 280 L455 260" fill="none" stroke="#dce6f0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
