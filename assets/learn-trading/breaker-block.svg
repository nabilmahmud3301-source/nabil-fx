<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-label="BREAKER BLOCK bullish and bearish trading examples">
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#0c1420"/><stop offset="1" stop-color="#060a10"/></linearGradient></defs>
<rect width="1100" height="520" rx="18" fill="url(#bg)" stroke="#34465b"/>
