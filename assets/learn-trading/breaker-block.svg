<text x="1055" y="47" text-anchor="end" fill="#93a4b8" font-family="Arial,sans-serif" font-size="12">EDUCATIONAL CHART EXAMPLES</text>
<g transform="translate(35 78)"><rect width="500" height="350" rx="12" fill="#0a111b" stroke="#315444"/><text x="22" y="34" fill="#42c99a" font-family="Arial,sans-serif" font-size="18" font-weight="700">BULLISH BREAKER</text>
<path d="M25 90H475 M25 160H475 M25 230H475 M25 300H475" stroke="#263443" stroke-dasharray="3 7"/>
