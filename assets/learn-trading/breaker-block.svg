<rect x="35" y="448" width="1030" height="42" rx="8" fill="#111c29" stroke="#2d4054"/>
<text x="55" y="475" fill="#d8e2ec" font-family="Arial,sans-serif" font-size="14">Mark the zone before price returns. Confirm context, reaction and invalidation; the illustration is not a trade signal.</text>
