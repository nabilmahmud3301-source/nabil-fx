<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650"><rect width="1200" height="650" rx="18" fill="#080d13"/><text x="48" y="62" fill="#f1f5f9" font-size="30" font-weight="800">INTERNAL VS EXTERNAL STRUCTURE</text><g font-family="Arial" font-weight="700"><rect x="36" y="92" width="548" height="510" rx="14" fill="#101a25" stroke="#2b4558"/><rect x="616" y="92" width="548" height="510" rx="14" fill="#101a25" stroke="#2b4558"/><text x="64" y="135" fill="#48c7a0" font-size="22">BULLISH EXTERNAL STRUCTURE</text><text x="644" y="135" fill="#e07884" font-size="22">BEARISH EXTERNAL STRUCTURE</text><path d="M80 430 L190 260 L280 330 L390 175 L500 245" stroke="#48c7a0" stroke-width="6" fill="none"/><path d="M205 280 L230 245 L250 280 L270 255 L285 330" stroke="#73a9e8" stroke-width="4" fill="none"/><path d="M660 180 L770 350 L860 280 L970 440 L1080 360" stroke="#e07884" stroke-width="6" fill="none"/><path d="M785 335 L810 300 L830 335 L850 310 L865 280" stroke="#73a9e8" stroke-width="4" fill="none"/><text x="84" y="535" fill="#9aabba" font-size="17">Large swing = external · small pullback = internal</text><text x="664" y="535" fill="#9aabba" font-size="17">Large swing = external · small rally = internal</text></g></svg>